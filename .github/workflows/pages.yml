name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/web/package-lock.json

      # Landing page (static) -> /
      - name: Assemble site
        run: |
          mkdir -p _pages
          cp -r site/* _pages/

      # Regenerate the Grammatik/Redemittel decks from data/banks/*.yaml so
      # the bundled lernweb decks always match the source-of-truth banks.
      - name: banks -> bundled decks
        run: |
          npm ci
          npm run build
          node dist/index.js banks-to-decks

      # lernweb PWA -> /app/
      - name: Build lernweb
        working-directory: apps/web
        env:
          BASE_PATH: /lernflow/app/
        run: |
          npm ci
          npm run build
          mkdir -p ../../_pages/app
          cp -r dist/* ../../_pages/app/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
