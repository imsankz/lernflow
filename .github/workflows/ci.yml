name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cli:
    name: CLI (build + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci
      - run: npm run build
      - run: npm test

      - name: doctor (informational — never fails CI on missing optional backends)
        run: node dist/index.js doctor || true

      - name: banks-to-decks stays in sync with data/banks/*.yaml
        run: |
          node dist/index.js banks-to-decks --out /tmp/decks-check
          for f in grammatik-a1 grammatik-a2 grammatik-b1 redemittel-b1; do
            diff -q "/tmp/decks-check/$f.json" "apps/web/public/decks/$f.json" || {
              echo "::error::apps/web/public/decks/$f.json is stale — run \`npm run build && node dist/index.js banks-to-decks\` and commit the result";
              exit 1;
            }
          done

  python:
    name: Python (apkg export + integrity checker)
    # test_apkg.py shells out to macOS `say`/`afconvert` to synthesize its
    # fixture audio clips, so this suite only runs on the macos runner.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install genanki
      - run: python3 py/test_apkg.py

  web:
    name: lernweb (typecheck + vitest + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - run: npm ci
      - run: npx tsc -b --noEmit
      - run: npm test -- run
      - run: npm run build
